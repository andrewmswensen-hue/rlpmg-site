# Preview build on GitHub Pages. Cloudflare remains the production target.
# Pages serves the site under /rlpmg-site/, so scripts/pages-prefix.mjs rewrites root-relative links after the build.
# Every preview page carries noindex so the staging copy never competes with rlpmg.com.
name: Preview (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PREVIEW_NOINDEX: '1'
      - run: node scripts/pages-prefix.mjs /rlpmg-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
